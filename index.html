<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>J Empire Serving — Job Board Test</title>

  <style>
    :root{
      --cream:#f7f0e5;
      --paper:#fffdf8;
      --ink:#1d1a18;
      --espresso:#3d302b;
      --gold:#b88a2d;
      --line:#dfd0be;
      --good-bg:#e2eadf;
      --good-text:#345438;
      --bad-bg:#f4e1db;
      --bad-text:#834234;
      --muted:#74675e;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-width:320px;
      background:radial-gradient(circle at top right,rgba(217,187,115,.18),transparent 30rem),var(--cream);
      color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    }

    .app{
      max-width:760px;
      margin:auto;
      padding:24px 16px 80px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      margin-bottom:22px;
    }

    .mark{
      width:54px;
      height:54px;
      display:grid;
      place-items:center;
      position:relative;
      border:1px solid var(--gold);
      border-radius:50%;
      background:var(--paper);
      color:var(--ink);
      font-family:Georgia,serif;
      font-size:2rem;
      font-style:italic;
    }

    .mark::before{
      content:"♕";
      position:absolute;
      top:-14px;
      color:var(--gold);
      font-size:1.15rem;
    }

    .eyebrow{
      color:var(--gold);
      font-size:.72rem;
      font-weight:800;
      letter-spacing:.14em;
      text-transform:uppercase;
    }

    h1,h2,p{margin-top:0}

    h1{
      margin-bottom:0;
      font-family:Georgia,serif;
      font-size:1.75rem;
      font-weight:600;
    }

    h2{
      font-family:Georgia,serif;
      font-weight:600;
    }

    .subtle{
      color:var(--muted);
      line-height:1.45;
    }

    .card{
      margin-top:16px;
      padding:20px;
      border:1px solid var(--line);
      border-radius:18px;
      background:rgba(255,253,248,.96);
      box-shadow:0 12px 30px rgba(66,45,26,.1);
    }

    label{
      display:grid;
      gap:6px;
      margin-top:12px;
      color:var(--espresso);
      font-size:.88rem;
      font-weight:700;
    }

    input,textarea{
      width:100%;
      min-height:46px;
      padding:11px;
      border:1px solid var(--line);
      border-radius:11px;
      background:#fffefa;
      color:var(--ink);
      font:inherit;
    }

    textarea{
      min-height:82px;
      resize:vertical;
    }

    .row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    .btn{
      width:100%;
      min-height:46px;
      margin-top:14px;
      padding:10px 14px;
      border:0;
      border-radius:12px;
      background:var(--espresso);
      color:#fff;
      font:inherit;
      font-weight:800;
      cursor:pointer;
      touch-action:manipulation;
    }

    .btn:disabled{
      opacity:.6;
      cursor:wait;
    }

    .btn.gold{
      background:var(--gold);
      color:#241b14;
    }

    .btn.secondary{
      border:1px solid var(--line);
      background:#fbf7f0;
      color:var(--espresso);
    }

    .status{
      margin-top:14px;
      padding:12px;
      border-radius:12px;
      line-height:1.4;
    }

    .status.good{
      background:var(--good-bg);
      color:var(--good-text);
    }

    .status.bad{
      background:var(--bad-bg);
      color:var(--bad-text);
    }

    .job-list{
      display:grid;
      gap:10px;
      margin-top:14px;
    }

    .job{
      padding:14px;
      border:1px solid var(--line);
      border-radius:14px;
      background:var(--paper);
    }

    .job strong{
      display:block;
      margin-bottom:3px;
    }

    .job span{
      display:block;
      color:var(--muted);
      font-size:.9rem;
      line-height:1.4;
    }

    .hidden{
      display:none !important;
    }

    @media(max-width:560px){
      .row{grid-template-columns:1fr}
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="brand">
      <div class="mark">J</div>
      <div>
        <div class="eyebrow">J Empire Serving</div>
        <h1>Job Board Test</h1>
      </div>
    </header>

    <section id="loginCard" class="card">
      <h2>Sign in</h2>
      <p class="subtle">
        Use the same email that appears in Supabase Authentication → Users.
      </p>

      <label>
        Email address
        <input id="email" type="email" autocomplete="email" placeholder="you@example.com">
      </label>

      <button id="sendLinkBtn" class="btn gold" type="button">
        Send Sign-In Link
      </button>

      <div id="loginMessage" aria-live="polite"></div>
    </section>

    <section id="appCard" class="hidden">
      <div class="card">
        <h2>Connected</h2>
        <p class="subtle">
          Signed in as <strong id="userEmail"></strong>.
        </p>
        <button id="signOutBtn" class="btn secondary" type="button">
          Sign Out
        </button>
      </div>

      <div class="card">
        <h2>Synced Jobs</h2>
        <p class="subtle">
          Your imported test job should appear below.
        </p>
        <button id="refreshBtn" class="btn secondary" type="button">
          Refresh Jobs
        </button>
        <div id="jobList" class="job-list"></div>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <script>
    const SUPABASE_URL = "https://ejseathlglvvnmkpchib.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVqc2VhdGhsZ2x2dm5ta3BjaGliIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5ODc4NTUsImV4cCI6MjA5NzU2Mzg1NX0.o4crd1W5-NbVNXSOWNT-WPHS7R6orRe9CRYFZfZ41L8";

    const APP_URL = "https://jazmarie624.github.io/Money-Assistant-/";

    const $ = (id) => document.getElementById(id);

    function setMessage(id, text, type) {
      const el = $(id);
      el.className = "status " + type;
      el.textContent = text;
    }

    function clearMessage(id) {
      const el = $(id);
      el.className = "";
      el.textContent = "";
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    if (!window.supabase || !window.supabase.createClient) {
      setMessage(
        "loginMessage",
        "The Supabase connection library did not load. Refresh once after GitHub finishes publishing.",
        "bad"
      );
      throw new Error("Supabase browser library did not load.");
    }

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    async function updateScreen() {
      const { data, error } = await supabaseClient.auth.getSession();
      const session = data && data.session;

      if (error) {
        setMessage("loginMessage", error.message, "bad");
        return;
      }

      if (session && session.user) {
        $("loginCard").classList.add("hidden");
        $("appCard").classList.remove("hidden");
        $("userEmail").textContent = session.user.email || "your account";
        await loadJobs();
      } else {
        $("loginCard").classList.remove("hidden");
        $("appCard").classList.add("hidden");
      }
    }

    async function sendLink() {
      const email = $("email").value.trim();
      const button = $("sendLinkBtn");

      if (!email) {
        setMessage("loginMessage", "Please enter your email address first.", "bad");
        return;
      }

      clearMessage("loginMessage");
      button.disabled = true;
      button.textContent = "Sending…";

      const { error } = await supabaseClient.auth.signInWithOtp({
        email: email,
        options: {
          emailRedirectTo: APP_URL
        }
      });

      button.disabled = false;
      button.textContent = "Send Sign-In Link";

      if (error) {
        setMessage("loginMessage", error.message, "bad");
        return;
      }

      setMessage(
        "loginMessage",
        "Success. Check your email, open the Supabase sign-in link, then return here.",
        "good"
      );
    }

    async function loadJobs() {
      $("jobList").innerHTML = "<p class='subtle'>Loading jobs…</p>";

      const { data, error } = await supabaseClient
        .from("jobs")
        .select("id, client_name, job_code, name, address, status, created_at")
        .order("created_at", { ascending: false })
        .limit(50);

      if (error) {
        $("jobList").innerHTML =
          "<div class='status bad'>" + escapeHtml(error.message) + "</div>";
        return;
      }

      if (!data || data.length === 0) {
        $("jobList").innerHTML =
          "<p class='subtle'>No jobs found yet. Your imported TEST-001 job should appear after you refresh.</p>";
        return;
      }

      $("jobList").innerHTML = data.map((job) => `
        <article class="job">
          <strong>${escapeHtml(job.name || "Name not entered")}</strong>
          <span>${escapeHtml(job.client_name || "Client not entered")} · Job #${escapeHtml(job.job_code || "—")}</span>
          <span>${escapeHtml(job.address || "Address not entered")}</span>
          <span>Status: ${escapeHtml(job.status || "pending")}</span>
        </article>
      `).join("");
    }

    async function signOut() {
      const { error } = await supabaseClient.auth.signOut();

      if (error) {
        alert(error.message);
        return;
      }

      await updateScreen();
    }

    $("sendLinkBtn").addEventListener("click", sendLink);
    $("refreshBtn").addEventListener("click", loadJobs);
    $("signOutBtn").addEventListener("click", signOut);

    supabaseClient.auth.onAuthStateChange(() => {
      updateScreen();
    });

    updateScreen();
  </script>
</body>
</html>
